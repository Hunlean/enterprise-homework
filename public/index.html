<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mekong Phone Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="bar">
  <a class="logo shop-name" href="/">Mekong Phone Shop</a><span class="spacer"></span>
  <a class="btn btn-ghost" href="order.html">Track order</a>
  <button class="btn btn-primary" id="cartBtn">🛒 Cart (<span id="cartCount">0</span>)</button>
</div></header>

<section class="hero"><div class="inner">
  <h1>Original phones, delivered in Phnom Penh</h1>
  <p>Order here on the website, or chat with us on Telegram. No app needed. Free delivery over $100.</p>
  <a class="btn btn-tg" id="tgHero" href="#" target="_blank" style="display:none">✈️ Order on Telegram</a>
</div></section>

<main>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
</main>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer">
  <div class="head"><b id="drawerTitle">Your cart</b><span class="spacer"></span><button class="btn btn-ghost" id="closeDrawer">✕</button></div>
  <div class="body" id="drawerBody"></div>
  <div class="foot" id="drawerFoot"></div>
</aside>

<footer>CS 491 Homework #1 demo · Website + Telegram ordering</footer>
<script src="app.js"></script>
</body>
</html>
